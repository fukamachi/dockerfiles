name: Auto-update pull request

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    paths:
      - '.github/workflows/auto-update.yml'

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [roswell, sbcl, ccl]
    steps:
      - uses: actions/checkout@v2
      - name: Auto-update
        run: |
          ./update.sh ${{ matrix.target }} > new-versions
          ./generate-readme.sh ${{ matrix.target }} > ${{ matrix.target }}/README.md
      - name: Versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versions=$(cut -d , -f 1 new-versions)
          if [ -z "$versions" ]; then
            exit 0
          fi
          # One branch per app and version set, so a pending PR is not duplicated
          # on later runs while new versions still get their own PR.
          branch="auto-update-${{ matrix.target }}-$(echo $versions | tr ' ' '-')"
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq length)
          {
            echo "branch=$branch"
            echo "open_prs=$open_prs"
            echo "list<<EOF"
            echo "$versions" | sed -e 's/^/* /'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create pull request
        if: steps.versions.outputs.branch != '' && steps.versions.outputs.open_prs == '0'
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Auto-update ${{ matrix.target }}.
          title: Auto-update ${{ matrix.target }}
          body: |
            ### New versions
            ${{ steps.versions.outputs.list }}

            Auto-generated by [create-pull-request](https://github.com/peter-evans/create-pull-request).
          labels: auto-update
          branch: ${{ steps.versions.outputs.branch }}
      - name: Check outputs
        run: |
          echo "Pull Request Number - ${{ env.PULL_REQUEST_NUMBER }}"
